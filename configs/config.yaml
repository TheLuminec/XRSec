mode: train

seed: 67
epochs: 20
lr: 0.001
# L2 penalty for Adam. Held-out accuracy peaks within a couple of epochs and then
# declines, so this is the main regularisation knob alongside extractor dropout.
weight_decay: 0.0

# Training objective.
#   pair_bce         the original: BCE over a linear layer on |e1 - e2|
#   identity_softmax classify which user each window belongs to with an angular
#                    margin (AM-Softmax), then compare embeddings by cosine. Uses
#                    every window as an example rather than every pair, and does not
#                    learn per-dimension weights tied to the training identities.
# identity_softmax forces head=cosine. Standard training only; boosting stays pairwise.
objective: pair_bce
identity_margin: 0.35
identity_scale: 30.0

# Pair scoring head: diff_linear (original) or cosine.
head: diff_linear

# Which input channels to build windows from.
#   full      quaternion + position (7 channels), the original
#   position  position only (3 channels)
# `position` unlocks 2814 extra sessions - 48% more data - because much of this
# corpus records position but no orientation: half of Head_and_Gaze (the V1_* files,
# same users as V2) and all of 360_em_dataset. Orientation also measures as a weak
# identity cue on its own (0.529 AUC on held-out users, against 0.768 for mean
# position), so this may cost little. Not every extractor accepts 3 channels - see
# CLAUDE.md.
channels: full

# Subtract each window's mean position, leaving only movement within the window.
# Absolute position carries height and seated posture, which is the strongest single
# identity cue measured here (0.768 AUC on unseen users) but an anthropometric one
# rather than a behavioural one. Centring isolates how the person moves. Paired with
# the uncentred run it answers whether this task is behavioural biometrics or body
# measurement - which changes how the work should be described, either way.
center_position: false

# Fraction of TRAINING users held out to choose the best epoch, disjoint from both
# training and the reported test users. 0 keeps the historical behaviour of picking
# the best epoch on the set being reported, which inflates the result by about +0.02:
# a random-output extractor scores 0.4973 at its final epoch but 0.5173 as a
# best-of-20. With this set, report `selected_test_acc`.
val_user_fraction: 0.0
batch_size: 1024
num_workers: 0
embedding_dim: 128
sample_time: 2
sample_rate: 20

samples_per_user: 512

# Input standardisation. Coordinate frames and scales differ per dataset (mean head
# height spans 0.00003 to 2.89; position range spans 40x), which otherwise lets a
# model identify the dataset instead of the user when several are pooled.
# per_dataset: standardise each dataset's channels separately (removes that shortcut)
# global:      one set of statistics over everything (fixes channel scale only)
# none:        raw values, as before
# Statistics are fitted on training users only and stored in the checkpoint.
normalize: per_dataset

# Draw negative pairs only from users in the same dataset. A positive pair is always
# the same user and so always the same dataset; without this, 79% of negatives become
# cross-dataset when several are pooled and the task degrades into "same dataset?".
# No effect when training on a single dataset.
within_dataset_negatives: true

# Build positive pairs from two DIFFERENT recording sessions of the same user.
# Same-session pairs share headset mounting, seating position and the content being
# viewed, so a model can score by matching the session rather than the person - and
# because held-out positives are same-session too, that shortcut never shows up as a
# train/test gap. Cross-session evaluation is the standard requirement in biometrics.
# Users with only one session (all of NJIT_6DOF) fall back to same-session pairs.
cross_session_positives: false

# Feature extractor: any name registered in model/extractors/.
# List them with: .venv/Scripts/python model/list_extractors.py
extractor: bilstm
# Hyperparameter overrides for the selected extractor, e.g.
#   extractor_params={lstm_hidden:128,pooling:last}
# Keys must be constructor arguments of that extractor; unknown keys are rejected.
extractor_params: null

# Support one or many dataset roots.
# Each entry should point to a processed_data/users directory.
data_dirs:
  - processed_datasets/VR_User_Behavior_Dataset_(Spherical_Video_Streaming)/users
#  - processed_datasets/ViewGauss_Head-Movement_Dataset/users
#  - processed_datasets/Panonut360_Dataset/users
#  - processed_datasets/NJIT_6DOF_VR_Navigation_Dataset/users
test_dirs: []
# - processed_datasets/ViewGauss_Head-Movement_Dataset/users
exclude_users: 
 - processed_datasets/VR_User_Behavior_Dataset_(Spherical_Video_Streaming)/users/1
 - processed_datasets/VR_User_Behavior_Dataset_(Spherical_Video_Streaming)/users/2
 - processed_datasets/VR_User_Behavior_Dataset_(Spherical_Video_Streaming)/users/3
 - processed_datasets/VR_User_Behavior_Dataset_(Spherical_Video_Streaming)/users/4
 - processed_datasets/VR_User_Behavior_Dataset_(Spherical_Video_Streaming)/users/5
swap_data: false
test_on_excluded: true

# Naming convention settings (Milestone A)
experiment_name: xrsec

# Use "auto" to enforce standardized names from naming conventions.
save_path: auto
model_path: auto

graph: true
graph_path: auto

boosting:
  enabled: false
  rounds: 10
  round_epochs: 20
  hard_fraction: 0.6
  refresh_fraction: 0.4
  candidate_pairs_per_user: 1024
  match_ratio: 0.5
  artifact_root: boosting
  resume: auto

# Sweep mode (mode=sweep): train many configurations and rank them.
sweep:
  # Which extractors to cover: "config" (the `extractor` above), "all"
  # (every registered extractor), or an explicit list.
  extractors: config
  # Axes to vary. "auto" uses each extractor's declared search_space().
  # Otherwise a mapping; prefix a key with `extractor_params.` to vary an
  # extractor hyperparameter, anything else varies a top-level config key:
  #   grid:
  #     lr: [0.001, 0.0003]
  #     extractor_params.lstm_hidden: [32, 64, 128]
  grid: auto
  # grid = every combination in order; random = an unbiased subset when max_runs caps it.
  strategy: grid
  # Cross-validate every configuration over K disjoint held-out user groups and rank
  # by the mean. Strongly recommended: which users are held out moves accuracy by
  # ~0.11 on this data, far more than the +/-0.02 binomial bar on 2560 pairs, so a
  # single fixed split cannot separate configurations that differ by a few points.
  # Ignores exclude_users and partitions every user across data_dirs.
  folds: null
  max_runs: null
  seed: null
  # Epochs per sweep run; null keeps the top-level `epochs`.
  epochs: null
  # Print the plan without training anything.
  dry_run: false
  # Made absolute at startup, so an interrupted sweep can resume across runs.
  artifact_root: sweeps
  resume: true

hydra:
  run:
    dir: runs/${now:%Y-%m-%d}/${now:%H-%M-%S}_${mode}
  job:
    chdir: true
