mode: train

seed: 67
epochs: 20
lr: 0.001
batch_size: 1024
num_workers: 0
embedding_dim: 128
sample_time: 2
sample_rate: 20

samples_per_user: 512

# Feature extractor: any name registered in model/extractors/.
# List them with: .venv/Scripts/python model/list_extractors.py
extractor: bilstm
# Hyperparameter overrides for the selected extractor, e.g.
#   extractor_params={lstm_hidden:128,pooling:last}
# Keys must be constructor arguments of that extractor; unknown keys are rejected.
extractor_params: null

# Support one or many dataset roots.
# Each entry should point to a processed_data/users directory.
data_dirs:
  - processed_datasets/VR_User_Behavior_Dataset_(Spherical_Video_Streaming)/users
#  - processed_datasets/ViewGauss_Head-Movement_Dataset/users
#  - processed_datasets/Panonut360_Dataset/users
#  - processed_datasets/NJIT_6DOF_VR_Navigation_Dataset/users
test_dirs: []
# - processed_datasets/ViewGauss_Head-Movement_Dataset/users
exclude_users: 
 - processed_datasets/VR_User_Behavior_Dataset_(Spherical_Video_Streaming)/users/1
 - processed_datasets/VR_User_Behavior_Dataset_(Spherical_Video_Streaming)/users/2
 - processed_datasets/VR_User_Behavior_Dataset_(Spherical_Video_Streaming)/users/3
 - processed_datasets/VR_User_Behavior_Dataset_(Spherical_Video_Streaming)/users/4
 - processed_datasets/VR_User_Behavior_Dataset_(Spherical_Video_Streaming)/users/5
swap_data: false
test_on_excluded: true

# Naming convention settings (Milestone A)
experiment_name: xrsec

# Use "auto" to enforce standardized names from naming conventions.
save_path: auto
model_path: auto

graph: true
graph_path: auto

boosting:
  enabled: false
  rounds: 10
  round_epochs: 20
  hard_fraction: 0.6
  refresh_fraction: 0.4
  candidate_pairs_per_user: 1024
  match_ratio: 0.5
  artifact_root: boosting
  resume: auto

# Sweep mode (mode=sweep): train many configurations and rank them.
sweep:
  # Which extractors to cover: "config" (the `extractor` above), "all"
  # (every registered extractor), or an explicit list.
  extractors: config
  # Axes to vary. "auto" uses each extractor's declared search_space().
  # Otherwise a mapping; prefix a key with `extractor_params.` to vary an
  # extractor hyperparameter, anything else varies a top-level config key:
  #   grid:
  #     lr: [0.001, 0.0003]
  #     extractor_params.lstm_hidden: [32, 64, 128]
  grid: auto
  # grid = every combination in order; random = an unbiased subset when max_runs caps it.
  strategy: grid
  max_runs: null
  seed: null
  # Epochs per sweep run; null keeps the top-level `epochs`.
  epochs: null
  # Print the plan without training anything.
  dry_run: false
  # Made absolute at startup, so an interrupted sweep can resume across runs.
  artifact_root: sweeps
  resume: true

hydra:
  run:
    dir: runs/${now:%Y-%m-%d}/${now:%H-%M-%S}_${mode}
  job:
    chdir: true
